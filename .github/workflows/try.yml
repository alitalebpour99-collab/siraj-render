name: Try (by hand)

# Renders jobs written as the service writes them, WITHOUT the service: no claim, no upload,
# nothing posted. Kept for looking at, for one day: stills and frames (JPEG), covers, slides, the
# manifest and the check record (JSON), the PICTURE of the video with no sound track at all, the
# narrator lines and where each voice goes. Never the recitation: it must not be downloadable
# from this public repository (scripts/try.mjs deletes every other sound file and video); a
# sample is mixed again on the owner PC from the public chapter files (scripts/sample-mux.mjs).

on:
  workflow_dispatch:
    inputs:
      jobs:
        description: "The jobs, as a JSON array of job objects (docs/renderer-handoff.md §2)"
        required: true
      stills:
        description: "Stills only (layout), no video and no sound"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  try:
    strategy:
      fail-fast: false
      matrix:
        job: ${{ fromJSON(inputs.jobs) }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RENDER_GL: swangle
      RENDER_CONCURRENCY: "4"
      PYTHON: python
      SAMPLE_PARTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-python@v5
        if: ${{ !inputs.stills }}
        with: { python-version: "3.11", cache: pip, cache-dependency-path: scripts/requirements.txt }
      - name: System packages
        timeout-minutes: 12
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo rm -f /var/lib/man-db/auto-update
          apt="-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o Dpkg::Use-Pty=0"
          for i in 1 2 3; do timeout 240 sudo -E apt-get $apt update && break; done
          timeout 420 sudo -E apt-get $apt install -y --no-install-recommends ffmpeg espeak-ng libnss3 libdbus-1-3 libatk1.0-0 libgbm-dev libxrandr2 libxkbcommon-dev libxfixes3 libxcomposite1 libxdamage1 libatk-bridge2.0-0 libpango-1.0-0 libcairo2 libcups2 | grep -E "^(Setting up|E:)" || true
          sudo -E apt-get $apt install -y --no-install-recommends libasound2t64 >/dev/null || sudo -E apt-get $apt install -y --no-install-recommends libasound2 >/dev/null
      - run: npm ci --no-audit --no-fund
      - if: ${{ !inputs.stills }}
        run: pip install -q -r scripts/requirements.txt
      - if: ${{ !inputs.stills }}
        uses: actions/cache@v4
        with:
          path: |
            models
            ~/.cache/huggingface
          key: voices-kokoro-82m-mana-persian-piper-v1
      - if: ${{ !inputs.stills }}
        name: The Persian voice model
        run: |
          mkdir -p models
          base=https://huggingface.co/MahtaFetrat/Mana-Persian-Piper/resolve/main
          for f in fa_IR-mana-medium.onnx fa_IR-mana-medium.onnx.json; do
            test -s "models/$f" || curl -fsSL --retry 3 -o "models/$f" "$base/$f"
          done
      - name: Browser
        run: node -e "import('@remotion/renderer').then((m) => m.ensureBrowser())"
      - name: Try the job
        env:
          JOB: ${{ toJSON(matrix.job) }}
        run: |
          mkdir -p jobs
          printf '%s' "$JOB" > jobs/try.json
          node scripts/try.mjs jobs/try.json ${{ inputs.stills && '--stills' || '' }}
      - name: Only pictures, JSON and the narrator's lines leave the run (never the qari)
        if: always()
        run: |
          mkdir -p keep
          cp out/frames/*.jpg out/*.jpg out/*.json keep/ 2>/dev/null || true
          cp out/*.picture.mp4 keep/ 2>/dev/null || true
          if [ -d out/voice ]; then cp -r out/voice keep/voice; fi
          ls -la keep
          for v in keep/*.mp4; do
            [ -e "$v" ] || continue
            case "$v" in *.picture.mp4) ;; *) echo "a video in keep/: $v"; exit 1 ;; esac
            if ffprobe -v error -show_entries stream=codec_type -of csv=p=0 "$v" | grep -q audio; then echo "sound in $v"; exit 1; fi
          done
          if find keep -type f \( -iname '*.wav' -o -iname '*.mp3' -o -iname '*.m4a' -o -iname '*.aac' \) -not -path 'keep/voice/*' | grep -q .; then echo "a sound file outside keep/voice"; exit 1; fi
          if find keep -name 'q-*' | grep -q .; then echo "a qari clip in keep/"; exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: try-${{ matrix.job.id }}
          path: keep/
          retention-days: 1
          if-no-files-found: warn

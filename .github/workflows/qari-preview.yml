name: Qari preview (private)

# Renders the two PRIVATE preview videos of 24 October 2026 (en-qari: Surah 112, fa-qari:
# Surah 103) for the owner only, on the branch preview/qari-voice. Publishes nothing.
#
# The texts come from Siraj's public API during the run (scripts/fetch.mjs). The qari's
# recitation and its word timings come from the Quran Foundation (api.quran.com, no account)
# and are DOWNLOADED DURING THE RUN ONLY: no recitation audio is ever committed (checked below).
# The narrator's MP3s (ElevenLabs, made on the owner's PC) are committed; no key or secret is
# used here. No music, no bed, no sound effects.

on:
  workflow_dispatch:
    inputs:
      samples:
        description: 'Which previews, as JSON (e.g. ["en-qari"])'
        required: false
        default: '["en-qari","fa-qari"]'
  push:
    branches: [preview/qari-voice]

permissions:
  contents: read

concurrency:
  group: qari-preview-${{ github.ref }}-${{ inputs.samples || 'all' }}
  cancel-in-progress: true

jobs:
  preview:
    # one job per preview, side by side (the first run rendered one in 34 minutes and hit the limit)
    strategy:
      fail-fast: false
      matrix:
        sample: ${{ fromJSON(inputs.samples || '["en-qari","fa-qari"]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 100
    env:
      RENDER_GL: swangle
      RENDER_CONCURRENCY: "4"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: No recitation audio in the repository (only the narrator's MP3s)
        run: |
          audio=$(git ls-files | grep -iE '\.(mp3|wav|m4a|aac|ogg|opus|flac)$' || true)
          echo "$audio"
          if echo "$audio" | grep -v -E '^public/narration/(en|fa)-qari/[a-z0-9]+\.mp3$' | grep -q .; then
            echo "an audio file outside public/narration is tracked"; exit 1
          fi

      - name: System packages (ffmpeg, the libraries Chrome Headless Shell needs)
        timeout-minutes: 12
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo rm -f /var/lib/man-db/auto-update
          apt="-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o Dpkg::Use-Pty=0"
          for i in 1 2 3; do timeout 240 sudo -E apt-get $apt update && break; echo "apt update attempt $i failed"; done
          timeout 420 sudo -E apt-get $apt install -y --no-install-recommends ffmpeg libnss3 libdbus-1-3 libatk1.0-0 libgbm-dev libxrandr2 libxkbcommon-dev libxfixes3 libxcomposite1 libxdamage1 libatk-bridge2.0-0 libpango-1.0-0 libcairo2 libcups2 | grep -E "^(Setting up|E:)" || true
          sudo -E apt-get $apt install -y --no-install-recommends libasound2t64 >/dev/null || sudo -E apt-get $apt install -y --no-install-recommends libasound2 >/dev/null
          ffmpeg -version | head -1
          node --version

      - run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Tests (placeholders only)
        run: node --experimental-strip-types --test scripts/qari.test.mjs

      - name: Texts from Siraj's public API
        run: node scripts/fetch.mjs ${{ matrix.sample }}

      - name: The qari's clips and word timings, the narrator levelled
        run: node --experimental-strip-types scripts/qari.mjs ${{ matrix.sample }}

      - name: Browser
        run: node -e "import('@remotion/renderer').then((m) => m.ensureBrowser())"

      - name: Render the previews, covers and frame sheets
        run: node --experimental-strip-types scripts/render.mjs ${{ matrix.sample }}

      - name: What was made
        run: ls -la out out/frames

      - uses: actions/upload-artifact@v4
        with:
          name: qari-preview-${{ matrix.sample }}
          path: out/
          retention-days: 2
          if-no-files-found: error

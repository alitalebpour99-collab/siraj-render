name: Check

# Typecheck and the unit tests (placeholders only) on every push. No render, no secret.

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - name: No sound file in the repository (the recitation is never committed)
        run: |
          audio=$(git ls-files | grep -iE '\.(mp3|wav|m4a|aac|ogg|opus|flac)$' || true)
          if [ -n "$audio" ]; then echo "$audio"; echo "an audio file is tracked"; exit 1; fi
      - run: npm ci --no-audit --no-fund
      - run: npx tsc --noEmit
      - run: node --experimental-strip-types --test scripts/render.test.mjs scripts/insights.test.mjs scripts/waiting.test.mjs scripts/reading.test.mjs
